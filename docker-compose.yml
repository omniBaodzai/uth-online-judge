
services:
  postgres:
    image: postgres:17-alpine
    container_name: uth-online-judge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uth-online-judge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uth-online-judge-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      REDIS_HOST: uth-online-judge-redis
      REDIS_PORT: 6379
      JUDGING_CONCURRENCY: ${JUDGING_CONCURRENCY:-2}
      JUDGING_GLOBAL_CONCURRENCY: ${JUDGING_GLOBAL_CONCURRENCY:-2}
      JUDGING_BATCH_SIZE: ${JUDGING_BATCH_SIZE:-8}
      JUDGE0_REQUEST_TIMEOUT_MS: ${JUDGE0_REQUEST_TIMEOUT_MS:-30000}
      JUDGE0_POLL_INTERVAL_MS: ${JUDGE0_POLL_INTERVAL_MS:-100}
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it}
      AI_ASSISTANT_TIMEOUT_MS: ${AI_ASSISTANT_TIMEOUT_MS:-15000}
      AI_ASSISTANT_MAX_OUTPUT_TOKENS: ${AI_ASSISTANT_MAX_OUTPUT_TOKENS:-400}
      AI_ASSISTANT_GUEST_COOKIE_SECRET: ${AI_ASSISTANT_GUEST_COOKIE_SECRET:-}
      AI_ASSISTANT_GUEST_COOKIE_TTL_SECONDS: ${AI_ASSISTANT_GUEST_COOKIE_TTL_SECONDS:-86400}
      AI_ASSISTANT_GUEST_COOKIE_SECURE: ${AI_ASSISTANT_GUEST_COOKIE_SECURE:-}
      AI_ASSISTANT_GUEST_REQUESTS_PER_MINUTE: ${AI_ASSISTANT_GUEST_REQUESTS_PER_MINUTE:-10}
      AI_ASSISTANT_GUEST_REQUESTS_PER_HOUR: ${AI_ASSISTANT_GUEST_REQUESTS_PER_HOUR:-60}
      AI_ASSISTANT_USER_REQUESTS_PER_MINUTE: ${AI_ASSISTANT_USER_REQUESTS_PER_MINUTE:-20}
      AI_ASSISTANT_IDENTITY_CONCURRENCY: ${AI_ASSISTANT_IDENTITY_CONCURRENCY:-1}
      AI_ASSISTANT_IP_REQUESTS_PER_MINUTE: ${AI_ASSISTANT_IP_REQUESTS_PER_MINUTE:-300}
      AI_ASSISTANT_GLOBAL_REQUESTS_PER_MINUTE: ${AI_ASSISTANT_GLOBAL_REQUESTS_PER_MINUTE:-300}
      AI_ASSISTANT_GLOBAL_PROVIDER_CONCURRENCY: ${AI_ASSISTANT_GLOBAL_PROVIDER_CONCURRENCY:-4}
      AI_ASSISTANT_PROVIDER_DAILY_ATTEMPTS: ${AI_ASSISTANT_PROVIDER_DAILY_ATTEMPTS:-200}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-UTH Online Judge <onboarding@resend.dev>}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:3000/auth/github/callback}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      JUDGE0_API_URL: ${JUDGE0_API_URL:?Set JUDGE0_API_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - judge0_net

  
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          - uth-online-judge-redis

volumes:
  postgres_data:
  frontend_node_modules:
  backend_node_modules:
  redis_data:

networks:
  judge0_net:
    external: true
    name: judge0-local_default
